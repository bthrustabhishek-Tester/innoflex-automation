name: Innoflex Playwright Automation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'stg'
        type: choice
        options: [dev, stg, uat, prod]
  schedule:
    # Nightly regression run at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  e2e-tests:
    name: E2E Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, edge]

    env:
      ENV: ${{ github.event.inputs.environment || 'stg' }}
      STG_URL: ${{ secrets.STG_URL }}
      STG_USERNAME: ${{ secrets.STG_USERNAME }}
      STG_PASSWORD: ${{ secrets.STG_PASSWORD }}
      API_BASE_URL_STG: ${{ secrets.API_BASE_URL_STG }}
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ matrix.project }}
          path: reports/html-report
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: reports/allure-results
          retention-days: 14

      - name: Upload traces/videos/screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ matrix.project }}
          path: test-results
          retention-days: 14

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENV: ${{ github.event.inputs.environment || 'stg' }}
      API_BASE_URL_STG: ${{ secrets.API_BASE_URL_STG }}
      STG_USERNAME: ${{ secrets.STG_USERNAME }}
      STG_PASSWORD: ${{ secrets.STG_PASSWORD }}
      CI: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=api

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-html-report
          path: reports/html-report
          retention-days: 14

  publish-allure-report:
    name: Publish Combined Allure Report
    needs: [e2e-tests, api-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          path: reports/allure-results-all
          pattern: allure-results-*
          merge-multiple: true

      - name: Generate combined Allure report
        run: npx allure-commandline generate reports/allure-results-all --clean -o reports/allure-report

      - name: Upload combined Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-combined
          path: reports/allure-report
          retention-days: 30
